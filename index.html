<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zero-overflow-ui - Interactive Viewport Scanner</title>
  <style>
    :root { --bg: #090d16; --card: #111827; --border: #1f2937; --text: #f3f4f6; --muted: #9ca3af; --accent: #38bdf8; --err: #f87171; --warn: #fbbf24; --ok: #34d399; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 24px; }
    header { max-width: 1000px; margin: 0 auto 20px; }
    h1 { font-size: 24px; font-weight: 700; color: #fff; margin-bottom: 6px; }
    p { color: var(--muted); font-size: 14px; }
    .grid { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); }
    textarea { width: 100%; height: 280px; background: #030712; border: 1px solid var(--border); border-radius: 6px; color: #e5e7eb; font-family: monospace; font-size: 13px; padding: 12px; resize: vertical; outline: none; }
    textarea:focus { border-color: var(--accent); }
    .results { overflow-y: auto; max-height: 280px; display: flex; flex-direction: column; gap: 8px; }
    .issue { background: #030712; border-left: 4px solid var(--err); border-radius: 4px; padding: 10px; font-size: 12px; font-family: monospace; }
    .issue.warn { border-left-color: var(--warn); }
    .issue-title { font-weight: 700; margin-bottom: 4px; color: #fff; }
    .issue-fix { color: var(--ok); margin-top: 4px; }
    .clean-badge { background: rgba(52, 211, 153, 0.1); border: 1px solid var(--ok); color: var(--ok); padding: 16px; border-radius: 6px; text-align: center; font-weight: 600; font-size: 14px; }
    .summary { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <header>
    <h1>zero-overflow-ui Playground</h1>
    <p>Client-side static scanner preventing mobile horizontal overflow (<360px viewport).</p>
  </header>
  <div class="grid">
    <div class="panel">
      <label for="input">HTML / Tailwind Template Code</label>
      <textarea id="input"><section class="w-screen bg-slate-900 p-8">
  <div class="w-[600px] flex items-center justify-between">
    <h1 class="flex-1 truncate">Very long dynamic title</h1>
  </div>
  <table class="w-full mt-4">
    <tr><td>Data cell</td></tr>
  </table>
</section></textarea>
      <div class="summary">
        <span>Press any key to rescan</span>
        <span id="statCount">0 issues</span>
      </div>
    </div>
    <div class="panel">
      <label>Live Viewport Audit</label>
      <div id="results" class="results"></div>
    </div>
  </div>
  <script>
    const RULES = [
      { id: "w-screen", name: "w-screen Viewport Leak", severity: "error", check: (l) => l.includes("w-screen") ? { token: "w-screen", fix: "Replace with 'w-full'" } : null },
      { id: "rigid-width", name: "Fixed Width >= 360px", severity: "error", check: (l) => { const m = l.match(/w-\[(\d+)px\]/); return (m && parseInt(m[1]) >= 360) ? { token: m[0], fix: "Use 'w-full max-w-[' + m[1] + 'px]'" } : null; } },
      { id: "flex-truncate", name: "Truncate without min-w-0", severity: "warn", check: (l, idx, lines) => (l.includes("truncate") && !l.includes("min-w-0") && lines.some(pl => pl.includes("flex"))) ? { token: "truncate", fix: "Add 'min-w-0' to flex child" } : null },
      { id: "table-unwrapped", name: "Unwrapped Table Element", severity: "warn", check: (l, idx, lines) => (/<(table|pre)\b/.test(l) && (idx === 0 || !lines[idx - 1].includes("overflow-x-auto"))) ? { token: "<table", fix: "Wrap with 'overflow-x-auto w-full'" } : null }
    ];
    function scan() {
      const lines = document.getElementById("input").value.split("\n");
      const issues = [];
      lines.forEach((line, idx) => {
        RULES.forEach(r => {
          const res = r.check(line, idx, lines);
          if (res) issues.push({ line: idx + 1, rule: r.name, severity: r.severity, ...res, code: line.trim() });
        });
      });
      const resultsEl = document.getElementById("results");
      const statCount = document.getElementById("statCount");
      statCount.textContent = `${issues.length} issue(s)`;
      if (issues.length === 0) {
        resultsEl.innerHTML = '<div class="clean-badge">✔ 0 horizontal overflow leaks detected. Viewport is clean.</div>';
        return;
      }
      resultsEl.innerHTML = issues.map(i => `
        <div class="issue ${i.severity}">
          <div class="issue-title">[${i.severity.toUpperCase()}] Line ${i.line}: ${i.rule}</div>
          <div>Token: <u>${i.token}</u> | Code: <code>${i.code.slice(0, 50)}</code></div>
          <div class="issue-fix">Fix: ${i.fix}</div>
        </div>
      `).join("");
    }
    document.getElementById("input").addEventListener("input", scan);
    scan();
  </script>
</body>
</html>
