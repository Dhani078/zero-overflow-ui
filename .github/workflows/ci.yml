name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run Test Suite
        run: npm test
      - name: Self-Scan Viewport
        run: node bin/zero-overflow.js scan .
      - name: Verify Examples
        run: node bin/zero-overflow.js scan examples/good-template.html
