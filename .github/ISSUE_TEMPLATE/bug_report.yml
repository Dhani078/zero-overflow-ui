name: Bug report
description: Create a report to help us improve zero-overflow-ui
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for contributing! Please fill out the details below.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the false positive or scanner issue.
    validations:
      required: true
  - type: textarea
    id: code-snippet
    attributes:
      label: Code snippet
      description: The HTML/JSX/Tailwind code that caused the issue.
      render: html
    validations:
      required: true
