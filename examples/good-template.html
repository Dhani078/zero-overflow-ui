<!-- Example of compliant responsive template -->
<section class="w-full max-w-7xl mx-auto bg-slate-900 text-white min-h-screen p-4 md:p-8 overflow-hidden">
  <div class="w-full md:w-[600px] bg-slate-800 p-6 rounded-xl flex items-center justify-between">
    <h1 class="text-xl font-bold flex-1 min-w-0 truncate">Unconstrained long dynamic user document title that bleeds over</h1>
    <button class="bg-blue-600 px-4 py-2 rounded shrink-0">Action</button>
  </div>

  <div class="w-full overflow-x-auto mt-8">
    <table class="w-full border border-slate-700">
      <thead>
        <tr>
          <th class="p-4 border">Metric</th>
          <th class="p-4 border">Value</th>
        </tr>
      </thead>
    </table>
  </div>

  <div class="overflow-hidden">
    <div class="-mx-4 md:-mx-8 mt-4 bg-slate-700 p-4">
      Clipped negative horizontal margin
    </div>
  </div>
</section>
